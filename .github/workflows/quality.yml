name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    # Weekly full run to catch dependency and upstream drift.
    - cron: "0 3 * * 1"

permissions:
  contents: read

# Cancel superseded runs for pull requests only; pushes to main (which
# deploy the Space) always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Python 3.11 contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          python-version: "3.11"
          enable-cache: true

      - name: Install tested runtime dependencies
        run: uv sync --frozen

      - name: Compile first-party Python
        run: uv run python -m compileall -q core demo reproduce tools

      - name: Run dependency-free regressions
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Scan public tree for anonymous-submission leaks
        run: uv run python tools/anonymity_scan.py

      - name: Scan public tree for secrets
        run: uv run python tools/security_scan.py

      - name: Validate the benchmark manifest and distribution source
        run: uv run python tools/benchmarks.py verify-pointers

      - name: Validate public reproduce configurations
        run: |
          uv run python tools/verify.py reproduce-contract --path reproduce/configs/spider/c3sql.json
          uv run python tools/verify.py reproduce-contract --path reproduce/configs/bird/e-sql-smoke.json

      - name: Validate release metadata and documentation links
        run: |
          uv run python - <<'PY'
          from tools.release_check import validate_document_links, validate_release_metadata
          from pathlib import Path

          errors = validate_release_metadata(Path.cwd()) + validate_document_links(Path.cwd())
          if errors:
              raise SystemExit("\n".join(errors))
          PY

  package:
    name: Python 3.11 package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          python-version: "3.11"
          enable-cache: true

      - name: Build source and wheel distributions
        run: uv build

  frontend:
    name: Demo workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: demo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test demo workspace
        run: npm test

      - name: Build demo workspace
        run: npm run build

  pi-runtime:
    name: Embedded Pi runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install the embedded Pi SDK
        run: bash demo/build_embedded_pi.sh

      - name: Test the Pi bridge security contract
        run: node --test tests/pi_agent_bridge.test.mjs

  hosted-space-image:
    name: Hugging Face Space image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download and install the packaged Spider benchmark
        run: |
          python tools/benchmarks.py download spider
          python tools/benchmarks.py install spider

      - name: Build the allowlisted Space context
        run: python tools/build_hf_space.py

      - name: Build the deployable Docker image
        run: docker build --tag squrvebridge-space:test build/hf-space

      # Publish exactly the context this job proved buildable, instead of
      # letting the deploy job regenerate one that was never image-tested.
      - name: Keep the proven Space context for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: hf-space-context
          path: build/hf-space
          retention-days: 1
          include-hidden-files: true

  deploy-hugging-face:
    name: Deploy Hugging Face Space
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - contracts
      - package
      - frontend
      - pi-runtime
      - hosted-space-image
      - history-security
    runs-on: ubuntu-latest
    # The upload deletes remote files before writing the new ones, so an
    # interrupted run would leave the Space missing files. Queue instead.
    concurrency:
      group: hugging-face-space-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.19.0"

      - name: Fetch the Space context the image job proved buildable
        uses: actions/download-artifact@v8
        with:
          name: hf-space-context
          path: build/hf-space

      - name: Publish the Space with a short-lived OIDC token
        env:
          HF_OIDC_RESOURCE: spaces/zmmjjkk/SqurveBridge
        run: |
          hf upload zmmjjkk/SqurveBridge build/hf-space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy GitHub ${GITHUB_SHA::7}"

  history-security:
    name: Reachable history security
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Scan history without printing matched values
        run: python tools/security_scan.py --history

  data-integrity:
    name: Full benchmark package integrity
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download every distributed benchmark archive
        run: python tools/benchmarks.py download all

      - name: Verify archive checksums, structure, and safety
        run: python tools/benchmarks.py verify-archives
